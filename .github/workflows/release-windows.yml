name: Release Goals for Windows

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, for example 1.1.0"
        required: true
        default: "1.0.0"

permissions:
  contents: write

concurrency:
  group: goals-windows-release
  cancel-in-progress: false

jobs:
  build-test-and-release:
    runs-on: windows-latest
    env:
      APP_PROJECT: CET6DesktopWidget01/Windows/Goals.Windows/Goals.Windows.csproj
      TEST_PROJECT: CET6DesktopWidget01/Windows/Goals.Windows.SmokeTests/Goals.Windows.SmokeTests.csproj
      UPDATE_REPOSITORY: https://github.com/${{ github.repository }}
      PACKAGE_ID: GoalsLifeDesk

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          if ("${{ github.ref_type }}" -eq "tag") {
            $version = "${{ github.ref_name }}" -replace '^v', ''
          } else {
            $version = "${{ inputs.version }}"
          }
          if ($version -notmatch '^\d+\.\d+\.\d+([-.][0-9A-Za-z.-]+)?$') {
            throw "Invalid release version: $version"
          }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore projects
        run: |
          dotnet restore "${{ env.APP_PROJECT }}"
          dotnet restore "${{ env.TEST_PROJECT }}"

      - name: Run regression tests
        run: dotnet run --project "${{ env.TEST_PROJECT }}" -c Release --no-restore

      - name: Publish Windows application
        run: >-
          dotnet publish "${{ env.APP_PROJECT }}"
          -c Release
          -r win-x64
          --self-contained true
          -p:Version=${{ steps.version.outputs.version }}
          -o publish
          --no-restore

      - name: Install Velopack CLI
        run: dotnet tool install --tool-path .tools vpk --version 1.2.0

      - name: Download previous release metadata
        shell: pwsh
        run: |
          .\.tools\vpk.exe download github `
            --repoUrl "${{ env.UPDATE_REPOSITORY }}" `
            --token "${{ secrets.GITHUB_TOKEN }}" `
            --outputDir Releases
          if ($LASTEXITCODE -ne 0) {
            Write-Host "No previous Velopack release was found; creating the first full release."
            $global:LASTEXITCODE = 0
          }

      - name: Build installer and update packages
        shell: pwsh
        run: |
          .\.tools\vpk.exe pack `
            --packId "${{ env.PACKAGE_ID }}" `
            --packVersion "${{ steps.version.outputs.version }}" `
            --packDir publish `
            --mainExe Goals.exe `
            --packTitle "Goals 学习计划中心" `
            --packAuthors "Goals" `
            --icon "CET6DesktopWidget01/Windows/Goals.Windows/Assets/Goals.ico" `
            --outputDir Releases

      - name: Publish GitHub Release
        shell: pwsh
        run: |
          .\.tools\vpk.exe upload github `
            --repoUrl "${{ env.UPDATE_REPOSITORY }}" `
            --token "${{ secrets.GITHUB_TOKEN }}" `
            --outputDir Releases `
            --publish `
            --releaseName "Goals v${{ steps.version.outputs.version }}" `
            --tag "v${{ steps.version.outputs.version }}" `
            --targetCommitish "${{ github.sha }}"

      - name: Keep installer as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Goals-Windows-${{ steps.version.outputs.version }}
          path: |
            Releases/*-Setup.exe
            Releases/releases.win.json
          if-no-files-found: error
